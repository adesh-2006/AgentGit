name: Agent Behavioral Diff

on:
  pull_request:
    paths:
      - "agentgit/**"
      - "examples/**"
      - "prompts/**"

jobs:
  behavior-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AgentGit
        run: pip install -e ".[dev]"

      - name: Run Behavioral Evaluation Demo & Diff
        run: |
          agentgit demo
